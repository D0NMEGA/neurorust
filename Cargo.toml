[workspace]
resolver = "3"
members = [
    "crates/manifest",
    "crates/histogram",
    "crates/capture",
    "crates/metrics",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/d0nmega/neurorust"

[workspace.dependencies]
nr-manifest = { path = "crates/manifest" }
nr-histogram = { path = "crates/histogram" }
nr-capture = { path = "crates/capture" }
nr-metrics = { path = "crates/metrics" }

hdrhistogram = "7.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
procfs = "0.18.0"
insta = { version = "1.48.0", features = ["json"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
