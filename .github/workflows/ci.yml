name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: kani
      # Swatinem/rust-cache does not know about ~/.kani, where cargo kani setup puts its own
      # bundled toolchain. Cache it explicitly, keyed on the pinned version, so a version bump
      # invalidates it rather than silently reusing the previous toolchain.
      - id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani-driver
          key: kani-0.67.0-${{ runner.os }}
      - if: steps.kani-cache.outputs.cache-hit != 'true'
        run: cargo install --locked kani-verifier@0.67.0
      - if: steps.kani-cache.outputs.cache-hit != 'true'
        run: cargo kani setup
      - run: scripts/nr-proofs.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # STOP-06 asks for branch coverage, which is not available on the toolchain
      # rust-toolchain.toml pins. D-57 pins a dated nightly for this job alone; every other job
      # above stays on stable. The date here must match scripts/nr-coverage.sh.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - id: llvmcov-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1-${{ runner.os }}
      - if: steps.llvmcov-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov@0.9.1
      - run: scripts/nr-coverage.sh
